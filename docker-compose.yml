version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: rideflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rideflow
    ports:
      - "5433:5432"
    volumes:
      - rideflow_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  rideflow_db_data:
